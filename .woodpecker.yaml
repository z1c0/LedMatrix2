# Builds run on k3s-forge (the cluster's amd64 build node, tainted
# build=true:NoSchedule): every step shares one workspace volume, which is
# pinned to the node of the first step, so all steps select amd64 and
# tolerate the taint. See z1c0/cluster bootstrap/build-node.md.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    backend_options:
      kubernetes:
        nodeSelector:
          kubernetes.io/arch: amd64
        tolerations:
          - key: build
            operator: Equal
            value: "true"
            effect: NoSchedule

steps:
  # Runs first so a failing test (or a broken rules.yaml) stops the build and deploy
  - name: test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    when:
      - event: push
        branch: main
    commands:
      - dotnet test MatrixClient/MatrixClient.sln
    backend_options:
      kubernetes:
        nodeSelector:
          kubernetes.io/arch: amd64
        tolerations:
          - key: build
            operator: Equal
            value: "true"
            effect: NoSchedule
        resources:
          requests:
            memory: 1Gi
            cpu: 1000m
          limits:
            memory: 4Gi
            cpu: 4000m

  - name: build-and-push
    image: woodpeckerci/plugin-kaniko
    when:
      - event: push
        branch: main
    settings:
      registry: registry-http.registry.svc.cluster.local
      repo: matrixclient
      tags: latest
      context: MatrixClient
      dockerfile: MatrixClient/Dockerfile
      insecure: true
      insecure-pull: true
      # Build on k3s-forge (amd64), produce an arm64 image for the Pis.
      # --credential-helpers= : Kaniko otherwise tries cloud credential
      # lookups (google, ecr, acr) that time out after 30 s per base image.
      extra_opts: --custom-platform=linux/arm64 --credential-helpers=
      # Kaniko resolves every base image for --custom-platform, so the SDK
      # stage gets an amd64-only tag (see Dockerfile).
      build_args: SDK_TAG=10.0-noble-amd64
    backend_options:
      kubernetes:
        nodeSelector:
          kubernetes.io/arch: amd64
        tolerations:
          - key: build
            operator: Equal
            value: "true"
            effect: NoSchedule
        resources:
          requests:
            memory: 1Gi
            cpu: 1000m
          limits:
            memory: 4Gi
            cpu: 4000m

  - name: deploy
    image: bitnami/kubectl
    when:
      - event: push
        branch: main
    commands:
      - kubectl rollout restart deployment/pixelmatrix -n pixelmatrix
    backend_options:
      kubernetes:
        serviceAccountName: woodpecker-agent
        nodeSelector:
          kubernetes.io/arch: amd64
        tolerations:
          - key: build
            operator: Equal
            value: "true"
            effect: NoSchedule
