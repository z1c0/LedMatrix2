interval_minutes: 10
enabled_on_startup: true

# Where rules overlap, the one listed first wins. Seasonal rules come first so they take over
# their windows while in season (from_date/to_date are MM-dd, inclusive) and step aside otherwise.
# `categories` mixes several sources: each send picks one of them at random.
# `season` stands for the current season's folder (spring Mar–May, summer Jun–Aug, fall Sep–Nov,
# winter Dec–Feb), so the year-round mixes below change with the seasons.

rules:
  # ── Seasonal ──────────────────────────────────────────────────────────────
  - name: Spooky Evenings
    days: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
    from: "17:00"
    to: "22:00"
    from_date: "10-01"
    to_date: "10-31"
    category: halloween

  - name: Spooky Weekend
    days: [Saturday, Sunday]
    from: "10:00"
    to: "17:00"
    from_date: "10-01"
    to_date: "10-31"
    categories: [halloween, rpg, weather]

  - name: Christmas Evenings
    days: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
    from: "16:00"
    to: "22:00"
    from_date: "12-01"
    to_date: "01-06"
    category: christmas

  - name: Christmas Weekend
    days: [Saturday, Sunday]
    from: "10:00"
    to: "16:00"
    from_date: "12-01"
    to_date: "01-06"
    categories: [christmas, food, weather]

  # ── Year-round ────────────────────────────────────────────────────────────
  - name: Daily Calendar
    days: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
    from: "00:00"
    to: "01:00"
    category: calendar

  - name: Morning Clock
    days: [Monday, Tuesday, Wednesday, Thursday, Friday]
    from: "06:00"
    to: "07:00"
    category: clock
    interval_minutes: 1

  - name: Morning Fuel
    days: [Monday, Tuesday, Wednesday, Thursday, Friday]
    from: "07:00"
    to: "09:00"
    categories: [food, weather, calendar]

  - name: Weekend Brunch
    days: [Saturday, Sunday]
    from: "08:00"
    to: "10:00"
    categories: [food, weather, season, football]

  - name: Workday Mix
    days: [Monday, Tuesday, Wednesday, Thursday, Friday]
    from: "09:00"
    to: "12:00"
    categories: [weather, other, arcade, season]

  - name: Lunch
    days: [Monday, Tuesday, Wednesday, Thursday, Friday]
    from: "12:00"
    to: "13:00"
    category: food

  - name: Football Friday
    days: [Friday]
    from: "13:00"
    to: "18:00"
    categories: [football, weather, rpg, arcade, season]

  - name: Afternoon Mix
    days: [Monday, Tuesday, Wednesday, Thursday]
    from: "13:00"
    to: "18:00"
    categories: [weather, rpg, arcade, other, season]

  - name: Weekend Adventure
    days: [Saturday, Sunday]
    from: "10:00"
    to: "18:00"
    categories: [football, rpg, arcade, weather, season]

  - name: Gaming Night
    days: [Friday, Saturday]
    from: "20:00"
    to: "24:00"
    categories: [arcade, rpg]

  - name: Football Evenings
    days: [Friday, Saturday, Sunday]
    from: "18:00"
    to: "22:00"
    categories: [football, rpg, arcade, food, weather, season]

  - name: Evening Mix
    days: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
    from: "18:00"
    to: "22:00"
    categories: [rpg, arcade, food, other, weather, season]

  - name: Evening Clock
    days: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
    from: "22:00"
    to: "24:00"
    category: clock
    interval_minutes: 1
